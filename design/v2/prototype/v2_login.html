<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internal Sales login v2</title>
<link rel="stylesheet" href="SKILL/templates/lg-tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1A1A1A}
body{font-family:"LG EI Text",sans-serif;color:#262626;
  /* Master Gradient 04 - official asset, crop only (cover), one gradient per page, not inside a shape */
  background:#090303 url("SKILL/assets/gradients/LGE_Electronics_Gradient_04_RGB.jpg") center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{width:440px;max-width:100%;background:#fff;border-radius:24px;padding:40px;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.card img{height:40px;display:block}
h1{font-family:"LG EI Headline";font-weight:600;font-size:28px;line-height:36px;margin-top:24px}
p.s{font-size:16px;line-height:24px;color:#4A4946;margin-top:6px}
label{display:block;font-size:14px;line-height:20px;color:#4A4946;margin-top:20px}
.in{height:48px;border:1px solid #CBC8C2;border-radius:12px;margin-top:6px;padding:0 16px;display:flex;align-items:center;color:#716F6A;font-size:16px}
.btn{margin-top:28px;height:48px;border-radius:999px;background:#EA1917;color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center}
.help{margin-top:20px;font-size:14px;line-height:20px;color:#716F6A;text-align:center}
</style></head>
<body><div class="card">
  <img src="SKILL/assets/logo/LGE_Logo_HeritageRed_Grey_RGB.png" alt="LG">
  <h1>Cổng bán hàng nội bộ</h1>
  <p class="s">Đăng nhập bằng mã nhân viên để tiếp tục</p>
  <label>Mã nhân viên</label><div class="in">Ví dụ: VH12345</div>
  <label>Mật khẩu</label><div class="in">Nhập mật khẩu</div>
  <div class="btn">Đăng nhập</div>
  <div class="help">Hỗ trợ tài khoản: Ban Quản trị bán hàng nội bộ</div>
</div></body></html>
